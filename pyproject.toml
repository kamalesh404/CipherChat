[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "cipherchat"
version = "0.1.0"
description = "End-to-end encrypted chat with X25519, AES-GCM, Double Ratchet"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kamalesh"}]
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio", "httpx", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py39"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
