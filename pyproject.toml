[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "cipherchat"
version = "0.1.0"
description = "End-to-end encrypted chat with X25519, AES-GCM, Double Ratchet"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kamalesh"}]
[tool.ruff]
line-length = 100
target-version = "py39"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
